[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",
    "E711",
    "E741",
    "UP031",   # upstream uses percent formatting extensively
    "SIM115",  # upstream opens files without context managers
    "SIM102",  # nested if style preserved from upstream
    "TRY002",  # upstream raises bare Exception
    "PERF102", # upstream iterates dict keys/values differently
    "PIE810",  # upstream calls startswith separately
    "PLC0206", # upstream extracts dict values without .items()
    "PLR1704", # upstream reuses variable names in comprehensions
    "RUF059",  # unpacked variable intentionally unused in upstream
    "B006",    # mutable default argument in upstream
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["msvc_wine"]